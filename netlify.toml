# Netlify 배포 설정
# Netlify deployment configuration

[build]
  # 빌드 명령어 (정적 사이트이므로 불필요)
  command = ""

  # 배포할 디렉토리
  publish = "."

  # 빌드 환경
  [build.environment]
    NODE_VERSION = "18"

# 리다이렉트 규칙 (SPA를 위한 설정)
[[redirects]]
  from = "/terminal"
  to = "/terminal.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 헤더 설정
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 정적 파일 캐싱
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML은 짧게 캐싱
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
